<title>SwingLab — Research Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2129; --ink-soft:#4B5563; --muted:#838B92;
    --bg:#EEECE3; --surface:#FBFAF6; --surface-2:#F4F1E9; --surface-3:#EAE6D9; --border:#DAD5C8;
    --neg:#BE4A38; --pos:#0E9A73; --accent:#B8791E; --accent-text:#8C5B14;
    --s1:#2a78d6; --s2:#c85a1e; --s3:#12946f; --s4:#9c7a00; --s5:#c04c78;
    --shadow: 0 1px 2px rgba(27,33,41,0.06), 0 8px 24px -12px rgba(27,33,41,0.15);
    --serif:'IBM Plex Serif', Georgia, 'Times New Roman', serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E9E7DF; --ink-soft:#B3AEA0; --muted:#78746A;
      --bg:#0B0C0D; --surface:#131415; --surface-2:#18191A; --surface-3:#1E2021; --border:#26282A;
      --neg:#E0705C; --pos:#2CBB8E; --accent:#D19A3D; --accent-text:#E3B15C;
      --s1:#5b9de6; --s2:#e0824c; --s3:#2fbd93; --s4:#d4a92e; --s5:#e087a8;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E9E7DF; --ink-soft:#B3AEA0; --muted:#78746A;
    --bg:#0B0C0D; --surface:#131415; --surface-2:#18191A; --surface-3:#1E2021; --border:#26282A;
    --neg:#E0705C; --pos:#2CBB8E; --accent:#D19A3D; --accent-text:#E3B15C;
    --s1:#5b9de6; --s2:#e0824c; --s3:#2fbd93; --s4:#d4a92e; --s5:#e087a8;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html{ color-scheme:light dark; }
  body{ margin:0; background:
    radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--accent) 5%, transparent), transparent),
    var(--bg);
    color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--accent); color:var(--bg); }
  p{ margin:0; }
  a{ color:inherit; }
  h1,h2,h3{ font-family:var(--serif); font-weight:600; margin:0; text-wrap:balance; }
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 20px 100px; }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:20px; }

  /* ============ top nav ============ */
  .topnav{ position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .topnav-in{ max-width:1080px; margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:18px; height:54px; }
  .brand{ font-family:var(--serif); font-weight:700; font-size:15.5px; letter-spacing:.01em; display:flex; align-items:center; gap:7px; white-space:nowrap; cursor:pointer; }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  nav.mainlinks{ display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none; }
  nav.mainlinks::-webkit-scrollbar{ display:none; }
  nav.mainlinks a{ font-size:12.5px; font-family:var(--mono); color:var(--muted); text-decoration:none; padding:7px 11px; border-radius:7px; white-space:nowrap; transition:color .12s,background .12s; }
  nav.mainlinks a:hover{ color:var(--ink); background:var(--surface-2); }
  nav.mainlinks a.active{ color:var(--ink); background:var(--surface-2); }
  .nav-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .searchbtn{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--muted); font-size:12px; font-family:var(--mono); cursor:pointer; }
  .searchbtn kbd{ font-family:var(--mono); background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:0px 5px; font-size:10.5px; }
  .marketpill{ display:none; align-items:center; gap:6px; font-family:var(--mono); font-size:11.5px; padding:5px 10px; border-radius:100px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); }
  @media(min-width:760px){ .marketpill{ display:flex; } }
  .marketpill .lit{ width:6px; height:6px; border-radius:50%; }

  /* ============ command palette ============ */
  .cmdk-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; }
  .cmdk{ width:min(560px,92vw); background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 30px 80px -20px rgba(0,0,0,.5); overflow:hidden; }
  .cmdk input{ width:100%; border:none; outline:none; background:transparent; padding:16px 18px; font-family:var(--mono); font-size:14.5px; color:var(--ink); border-bottom:1px solid var(--border); }
  .cmdk input::placeholder{ color:var(--muted); }
  .cmdk-list{ max-height:340px; overflow-y:auto; padding:6px; }
  .cmdk-item{ display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; }
  .cmdk-item:hover, .cmdk-item.sel{ background:var(--surface-2); }
  .cmdk-item .k{ font-family:var(--mono); font-size:10.5px; color:var(--muted); }

  /* ============ generic layout bits ============ */
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .section{ margin-top:52px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .section-head h2{ font-size:19px; }
  .section-head .hint{ font-size:12.5px; color:var(--muted); }
  .grid{ display:grid; gap:12px; }
  .grid.cols-2{ grid-template-columns:1fr; } @media(min-width:640px){ .grid.cols-2{ grid-template-columns:1fr 1fr; } }
  .grid.cols-3{ grid-template-columns:1fr; } @media(min-width:640px){ .grid.cols-3{ grid-template-columns:repeat(2,1fr); } } @media(min-width:900px){ .grid.cols-3{ grid-template-columns:repeat(3,1fr); } }
  .grid.cols-4{ grid-template-columns:repeat(2,1fr); } @media(min-width:760px){ .grid.cols-4{ grid-template-columns:repeat(4,1fr); } }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .panel.pad-lg{ padding:22px 24px; }
  .chip{ font-family:var(--mono); font-size:10.5px; letter-spacing:.03em; padding:3px 9px; border-radius:100px; border:1px solid var(--border); color:var(--muted); background:var(--surface-2); }
  .chip.good{ color:var(--pos); border-color:color-mix(in srgb, var(--pos) 35%, var(--border)); background:color-mix(in srgb, var(--pos) 12%, var(--surface)); }
  .chip.warn{ color:var(--accent-text); border-color:color-mix(in srgb, var(--accent) 35%, var(--border)); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .chip.bad{ color:var(--neg); border-color:color-mix(in srgb, var(--neg) 35%, var(--border)); background:color-mix(in srgb, var(--neg) 12%, var(--surface)); }
  .skeleton{ text-align:center; padding:60px 0; color:var(--muted); font-family:var(--mono); font-size:12.5px; }
  .empty-note{ font-size:12.5px; color:var(--muted); font-style:italic; }
  .btn{ font-family:var(--mono); font-size:12px; padding:7px 13px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{ }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{ background:var(--accent); border-color:var(--accent); color:#171208; } }
  :root[data-theme="dark"] .btn.primary{ background:var(--accent); border-color:var(--accent); color:#171208; }

  /* ============ home ============ */
  .hero{ padding:56px 0 18px; text-align:center; }
  .hero .eyebrow{ margin-bottom:14px; }
  .hero h1{ font-size:clamp(34px,7vw,54px); line-height:1.05; }
  .hero .sub{ margin:16px auto 0; max-width:58ch; color:var(--ink-soft); font-size:15.5px; line-height:1.6; }
  .hero .disclaimer-line{ margin-top:14px; font-size:11.5px; color:var(--muted); font-family:var(--mono); }
  .home-search{ max-width:560px; margin:30px auto 0; position:relative; }
  .home-search input{ width:100%; font-family:var(--mono); font-size:15px; padding:16px 20px; border:1.5px solid var(--border); border-radius:12px; background:var(--surface); color:var(--ink); outline:none; }
  .home-search input:focus{ border-color:var(--accent); }
  .suggestions{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); max-height:280px; overflow-y:auto; z-index:30; display:none; text-align:left; }
  .suggestions.open{ display:block; }
  .suggestions .row{ padding:10px 16px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .suggestions .row:hover{ background:var(--surface-2); }
  .suggestions .row .tkr{ font-family:var(--mono); font-weight:600; font-size:13px; }
  .suggestions .row .cname{ font-size:12px; color:var(--muted); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .mkt-card{ padding:16px 18px; }
  .mkt-card .lbl{ font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--muted); }
  .mkt-card .lvl{ font-family:var(--mono); font-size:23px; font-weight:600; margin-top:6px; }
  .mkt-card .chg{ font-family:var(--mono); font-size:12.5px; margin-top:3px; }
  .mkt-card .regime{ margin-top:10px; }
  .mkt-card .asof{ margin-top:8px; font-size:10.5px; color:var(--muted); font-family:var(--mono); }

  .desk-list{ display:flex; flex-direction:column; }
  .desk-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .desk-row:last-child{ border-bottom:none; }
  .desk-row:hover .tkr{ color:var(--accent-text); }
  .desk-row .tkr{ font-family:var(--mono); font-weight:600; font-size:13px; }
  .desk-row .nm{ font-size:11.5px; color:var(--muted); }
  .desk-row .val{ font-family:var(--mono); font-size:12.5px; }

  /* ============ company terminal ============ */
  .co-head{ padding:34px 0 0; }
  .co-head .row1{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .co-head h1{ font-size:clamp(24px,4.5vw,32px); }
  .co-head .tkr{ font-family:var(--mono); color:var(--muted); font-size:14px; }
  .co-head .price-row{ display:flex; align-items:baseline; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .co-head .price{ font-family:var(--mono); font-size:26px; font-weight:600; }
  .co-head .chg{ font-family:var(--mono); font-size:14px; }
  .ret-strip{ display:flex; gap:0; margin-top:16px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .ret-strip .cell{ flex:1; text-align:center; padding:9px 4px; border-right:1px solid var(--border); }
  .ret-strip .cell:last-child{ border-right:none; }
  .ret-strip .cell .k{ font-size:9.5px; color:var(--muted); font-family:var(--mono); text-transform:uppercase; }
  .ret-strip .cell .v{ font-family:var(--mono); font-size:12.5px; font-weight:600; margin-top:3px; }

  .mode-toggle{ display:inline-flex; margin-top:20px; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .mode-toggle button{ font-family:var(--mono); font-size:11.5px; padding:8px 16px; border:none; background:var(--surface); color:var(--muted); cursor:pointer; letter-spacing:.03em; }
  .mode-toggle button.active{ background:var(--ink); color:var(--bg); }
  @media(prefers-color-scheme:dark){ :root:not([data-theme="light"]) .mode-toggle button.active{ background:var(--accent); color:#171208; } }
  :root[data-theme="dark"] .mode-toggle button.active{ background:var(--accent); color:#171208; }

  .matrix{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(min-width:640px){ .matrix{ grid-template-columns:repeat(3,1fr); } }
  .matrix .cell{ background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px 14px; cursor:pointer; transition:border-color .12s; }
  .matrix .cell:hover{ border-color:var(--accent); }
  .matrix .cell .k{ font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .matrix .cell .v{ font-family:var(--serif); font-weight:600; font-size:15.5px; margin-top:6px; }
  .matrix .cell.strong .v, .matrix .cell.improving .v{ color:var(--pos); }
  .matrix .cell.weak .v, .matrix .cell.declining .v{ color:var(--neg); }
  .matrix .cell.moderate .v{ color:var(--accent-text); }
  .matrix .cell.nodata .v{ color:var(--muted); }
  .matrix-detail{ margin-top:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }

  .chart-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px 12px; }
  .chart-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }
  .chart-caption{ margin-top:6px; font-size:11.5px; color:var(--muted); text-align:center; }
  .chart-caption .dot-buy{ color:var(--pos); } .chart-caption .dot-sell{ color:var(--neg); }

  .fund-metric{ background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px 15px; }
  .fund-metric .k{ font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .fund-metric .v{ font-family:var(--mono); font-size:19px; font-weight:600; margin-top:5px; }
  .fund-metric .src{ font-size:10px; color:var(--muted); margin-top:5px; font-family:var(--mono); }

  .obs-list{ display:flex; flex-direction:column; gap:8px; }
  .obs-list .o{ font-size:13px; color:var(--ink-soft); line-height:1.55; padding-left:16px; position:relative; }
  .obs-list .o::before{ content:'—'; position:absolute; left:0; color:var(--accent); }

  .val-scale{ margin-top:14px; }
  .val-scale .track{ position:relative; height:8px; border-radius:100px; background:linear-gradient(90deg, var(--pos), var(--surface-3) 50%, var(--neg)); }
  .val-scale .marker{ position:absolute; top:-5px; width:3px; height:18px; background:var(--ink); border-radius:2px; }
  .val-scale .labels{ display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase; }

  .strat-cards{ display:flex; flex-direction:column; gap:10px; }
  .strat-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .strat-card summary{ list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  .strat-card summary::-webkit-details-marker{ display:none; }
  .strat-card .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .strat-card .name{ font-family:var(--serif); font-weight:600; font-size:13.5px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .state-pill{ font-family:var(--mono); font-size:10px; font-weight:600; padding:3px 9px; border-radius:100px; white-space:nowrap; flex:none; }
  .state-pill.held{ background:color-mix(in srgb, var(--pos) 18%, var(--surface)); color:var(--pos); }
  .state-pill.qualifies{ background:color-mix(in srgb, var(--accent) 20%, var(--surface)); color:var(--accent-text); }
  .state-pill.not-selected{ background:color-mix(in srgb, var(--neg) 14%, var(--surface)); color:var(--neg); }
  .state-pill.no-data{ background:var(--surface-2); color:var(--muted); border:1px dashed var(--border); }
  .strat-card .chev{ color:var(--muted); font-size:10px; }
  .strat-card[open] .chev{ transform:rotate(90deg); }
  .strat-card .body{ padding:0 16px 16px; }
  .strat-card .rule{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; }
  .strat-card .why{ margin-top:10px; font-size:12.5px; color:var(--ink); background:var(--surface-2); border-radius:8px; padding:9px 11px; }
  .checks{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .checks span{ font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:100px; }
  .checks span.pass{ background:color-mix(in srgb, var(--pos) 16%, var(--surface)); color:var(--pos); }
  .checks span.fail{ background:color-mix(in srgb, var(--neg) 14%, var(--surface)); color:var(--neg); }
  .stat-row{ display:flex; gap:18px; margin-top:12px; flex-wrap:wrap; }
  .stat-row .stat .v{ font-family:var(--mono); font-weight:600; font-size:14px; }
  .stat-row .stat .k{ font-size:10px; color:var(--muted); }
  table.trades{ width:100%; border-collapse:collapse; margin-top:10px; font-size:11.5px; }
  table.trades th{ text-align:right; font-family:var(--mono); font-size:9px; text-transform:uppercase; color:var(--muted); font-weight:500; padding:0 5px 5px; border-bottom:1px solid var(--border); }
  table.trades th:first-child, table.trades td:first-child{ text-align:left; }
  table.trades td{ padding:5px; border-bottom:1px solid var(--border); text-align:right; font-family:var(--mono); }
  table.trades tr:last-child td{ border-bottom:none; }
  .pnl-pos{ color:var(--pos); } .pnl-neg{ color:var(--neg); }
  .no-trades{ font-size:12px; color:var(--muted); margin-top:8px; font-style:italic; }
  .strat-track{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--border); font-size:11px; color:var(--muted); }

  .notes-box textarea{ width:100%; min-height:120px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:12px 14px; font-family:var(--sans); font-size:13px; color:var(--ink); resize:vertical; outline:none; }
  .notes-box textarea:focus{ border-color:var(--accent); }
  .thesis-grid{ display:grid; grid-template-columns:1fr; gap:10px; } @media(min-width:700px){ .thesis-grid{ grid-template-columns:1fr 1fr; } }
  .thesis-field label{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); display:block; margin-bottom:6px; }
  .thesis-field textarea{ width:100%; min-height:70px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-family:var(--sans); font-size:12.5px; color:var(--ink); resize:vertical; outline:none; }
  .thesis-field textarea:focus{ border-color:var(--accent); }
  .save-hint{ font-size:11px; color:var(--muted); margin-top:8px; font-family:var(--mono); }

  /* ============ watchlist / journal ============ */
  .wl-row{ display:grid; grid-template-columns:1fr auto auto auto; gap:10px; align-items:center; padding:11px 4px; border-bottom:1px solid var(--border); }
  .wl-row:last-child{ border-bottom:none; }
  .wl-row .nm{ min-width:0; } .wl-row .nm .t{ font-family:var(--mono); font-weight:600; font-size:13px; cursor:pointer; } .wl-row .nm .n{ font-size:11px; color:var(--muted); }
  .add-row{ display:flex; gap:8px; margin-bottom:14px; }
  .add-row input{ flex:1; font-family:var(--mono); font-size:13px; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); outline:none; }

  .journal-date{ font-family:var(--serif); font-size:20px; font-weight:600; }
  .journal-nav{ display:flex; gap:8px; align-items:center; }
  .day-section{ margin-top:16px; }
  .day-section h3{ font-size:13px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:8px; }
  .reviewed-chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11.5px; background:var(--surface-2); border:1px solid var(--border); padding:4px 10px; border-radius:100px; margin:0 6px 6px 0; }
  .reviewed-chip button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0; }

  /* ============ journey ============ */
  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{ content:''; position:absolute; left:6px; top:6px; bottom:6px; width:1.5px; background:var(--border); }

  .comp-table{ width:100%; border-collapse:collapse; font-size:12px; }

  .user-chip button:hover{ color:var(--ink); }
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:34px 30px; box-shadow:var(--shadow); }
  .login-card .brand{ justify-content:center; font-size:17px; margin-bottom:4px; }
  .login-sub{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:6px; margin-bottom:24px; }
  .login-card label{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); display:block; margin-bottom:6px; margin-top:14px; }
  .login-card input{ width:100%; font-family:var(--mono); font-size:14px; padding:11px 13px; border:1.5px solid var(--border); border-radius:9px; background:var(--surface-2); color:var(--ink); outline:none; }
  .login-card input:focus{ border-color:var(--accent); }
  .login-error{ margin-top:12px; font-size:12px; color:var(--neg); background:color-mix(in srgb, var(--neg) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--neg) 35%, var(--border)); border-radius:8px; padding:9px 11px; }

<script>
(function(){
  const API = '';
  const $view = document.getElementById('view');
  let META = null, MARKET = null, NAMES = {}, CURRENT_USER = null;

  /* ---------------- utils ---------------- */
  function fmtPct(x, d){ d = d==null?1:d; return x==null ? '—' : (x>=0?'+':'') + x.toFixed(d) + '%'; }
  function fmtNum(x, d){ d = d==null?1:d; return x==null ? '—' : x.toLocaleString('en-IN', {maximumFractionDigits:d}); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function go(hash){ location.hash = hash; }

  /* ---------------- auth gate ---------------- */
  function showApp(){
    document.getElementById('login-root').hidden = true;
    document.getElementById('topnav').hidden = false;
    document.getElementById('footer-wrap').hidden = false;
    $view.hidden = false;
  }

  function renderUserChip(){
    const el = document.getElementById('user-chip');
    el.hidden = false;
    el.innerHTML = `<span>${esc(CURRENT_USER.username)}${CURRENT_USER.is_demo ? ' · demo' : ''}</span><button id="logout-btn" title="Sign out">⎋</button>`;
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try{ await fetch(`${API}/api/logout`, {method:'POST'}); }catch(e){}
      location.reload();
    });
  }

  function showLogin(){
    document.getElementById('topnav').hidden = true;
    document.getElementById('footer-wrap').hidden = true;
    $view.hidden = true;
    const root = document.getElementById('login-root');
    root.hidden = false;
    root.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="brand"><span class="dot"></span>SWINGLAB</div>
          <p class="login-sub">Personal investing research lab. Sign in to continue.</p>
          <form id="login-form">
            <label>Username</label>
            <input id="login-username" autocomplete="username" required>
            <label>Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required>
            <div class="login-error" id="login-error" hidden></div>
            <button type="submit" class="btn primary" style="width:100%;margin-top:18px;padding:12px">Sign in</button>
          </form>
          <div class="demo-box">
            <div class="eyebrow">Just visiting?</div>
            <p>Use the demo account — full read access, nothing to set up.</p>
            <div class="demo-creds">demo / demo1234</div>
            <button class="btn" id="demo-login-btn" style="width:100%;margin-top:10px">Continue as demo</button>
          </div>
        </div>
      </div>`;
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await attemptLogin(document.getElementById('login-username').value.trim(), document.getElementById('login-password').value);
    });
    document.getElementById('demo-login-btn').addEventListener('click', () => attemptLogin('demo', 'demo1234'));
  }

  async function attemptLogin(username, password){
    const errEl = document.getElementById('login-error');
    errEl.hidden = true;
    if (!username || !password) return;
    try{
      const r = await fetch(`${API}/api/login`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password}),
      });
      if (!r.ok){ errEl.textContent = 'Wrong username or password.'; errEl.hidden = false; return; }
      CURRENT_USER = await r.json();
      showApp();
      renderUserChip();
      await afterAuthBoot();
    }catch(e){ errEl.textContent = 'Could not reach the server. Try again in a moment.'; errEl.hidden = false; }
  }

  /* ---------------- boot: check session, then load meta + market ---------------- */
  async function boot(){
    try{
      const r = await fetch(`${API}/api/me`);
      if (!r.ok){ showLogin(); return; }
      CURRENT_USER = await r.json();
    }catch(e){ showLogin(); return; }
    showApp();
    renderUserChip();
    await afterAuthBoot();
  }

  async function afterAuthBoot(){
    try{
      const r = await fetch(`${API}/api/meta`);
      META = await r.json();
      NAMES = META.names || {};
    }catch(e){ META = {strategy_meta:{}, as_of:'—'}; }
    await refreshMarketPill();
    router();
  }

  // one in-flight request shared by the nav pill, the home page, and the
  // journal — otherwise a cold cache on the backend gets hit by 2-3
  // concurrent requests instead of one.
  let _marketPromise = null;
  async function getMarket(forceRefresh){
    if (!forceRefresh && MARKET) return MARKET;
    if (!_marketPromise){
      _marketPromise = fetch(`${API}/api/market`).then(r => r.json())
        .then(m => { MARKET = m; _marketPromise = null; return m; })
        .catch(e => { _marketPromise = null; throw e; });
    }
    return _marketPromise;
  }

  async function refreshMarketPill(){
    try{
      const m = await getMarket(true);
      const v = m.vix, n = m.nifty50;
      const pillEl = document.getElementById('market-pill');
      if (n && v){
        const lit = n.chg_pct >= 0 ? 'var(--pos)' : 'var(--neg)';
        pillEl.innerHTML = `<span class="lit" style="background:${lit}"></span> NIFTY ${fmtNum(n.level,0)} ${fmtPct(n.chg_pct)} · VIX ${v.level.toFixed(1)}`;
      }
    }catch(e){ /* silent — pill just stays a dot */ }
  }

  /* ---------------- strategy labels ---------------- */
  const STRATEGY_ORDER = ['S1','S2','S3','S4','S5'];
  const STRATEGY_LABEL = { S1:'S1 · Long-Term Trend', S2:'S2 · Momentum', S3:'S3 · Value', S4:'S4 · Price Strength', S5:'S5 · Quality' };
  const STRATEGY_RULES = {
    S1: 'Hold whenever price is above its 250-day moving average; go flat when it falls below. Ride the trend until it breaks.',
    S2: 'Once a month, rank the universe by 6-month momentum (skipping the most recent month) and hold the top 30. Buy what\'s already working.',
    S3: 'Once a quarter, keep the cheaper half of the universe by valuation, then hold the strongest-momentum names from within that group.',
    S4: 'Once a month, look for stocks within 2% of their 52-week high, rank by momentum, hold the top 20. Exits on a 20% trailing stop.',
    S5: 'Every quarter: ROE > 15%, ROCE > 15%, positive free cash flow, growing earnings, manageable debt, 3 straight profitable years — all required. Survivors ranked by value.',
  };

  /* ================================================================
     ROUTER
  ================================================================ */
  const routes = {
    ''            : renderHome,
    'companies'   : renderHome,
    'company'     : renderCompany,
    'strategy-lab': renderStrategyLab,
    'watchlist'   : renderWatchlist,
    'journal'     : renderJournal,
    'journey'     : renderJourney,
    'methodology' : renderMethodology,
  };

  function parseHash(){
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean);
    return { view: parts[0] || '', arg: parts[1] || null };
  }

  function router(){
    const { view, arg } = parseHash();
    document.querySelectorAll('nav.mainlinks a').forEach(a => a.classList.toggle('active', a.dataset.r === view || (view==='company' && a.dataset.r==='companies')));
    const fn = routes[view] || renderHome;
    window.scrollTo(0,0);
    fn(arg);
  }
  window.addEventListener('hashchange', router);
  document.querySelector('.brand').addEventListener('click', () => go('#/'));

  /* ================================================================
     SEARCH (shared: home hero + company page)
  ================================================================ */
  let searchAbort = null;
  async function searchStocks(q){
    q = q.trim();
    if (!q) return [];
    if (searchAbort) searchAbort.abort();
    searchAbort = new AbortController();
    try{
      const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`, {signal: searchAbort.signal});
      return await r.json();
    }catch(e){ return []; }
  }

  function wireSearchBox(inputEl, suggestEl){
    let debounce;
    inputEl.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = inputEl.value;
      debounce = setTimeout(async () => {
        const list = await searchStocks(q);
        if (!list.length){ suggestEl.classList.remove('open'); suggestEl.innerHTML=''; return; }
        suggestEl.innerHTML = list.map(e => `<div class="row" data-t="${e.ticker}"><span class="tkr">${esc(e.symbol)}</span><span class="cname">${esc(e.name)}</span></div>`).join('');
        suggestEl.classList.add('open');
        suggestEl.querySelectorAll('.row').forEach(row => row.addEventListener('click', () => {
          suggestEl.classList.remove('open'); inputEl.value='';
          go('#/company/' + row.dataset.t);
        }));
      }, 180);
    });
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        const q = inputEl.value.trim().toUpperCase();
        if (q){ suggestEl.classList.remove('open'); go('#/company/' + (q.endsWith('.NS') ? q : q + '.NS')); }
      }
    });
    document.addEventListener('click', e => { if (!e.target.closest('.home-search')) suggestEl.classList.remove('open'); });
  }

  /* ================================================================
     COMMAND PALETTE
  ================================================================ */
  const cmdkRoot = document.getElementById('cmdk-root');
  const STATIC_CMDS = [
    {label:'Home', hash:'#/'}, {label:'Strategy Lab', hash:'#/strategy-lab'},
    {label:'Watchlist', hash:'#/watchlist'}, {label:'Daily Journal', hash:'#/journal'},
    {label:'Investing Journey', hash:'#/journey'}, {label:'Methodology', hash:'#/methodology'},
  ];
  function openCmdk(){
    cmdkRoot.innerHTML = `<div class="cmdk-backdrop" id="cmdk-bd"><div class="cmdk"><input id="cmdk-input" placeholder="Search a company, or jump to a page…" autocomplete="off"><div class="cmdk-list" id="cmdk-list"></div></div></div>`;
    const bd = document.getElementById('cmdk-bd'), input = document.getElementById('cmdk-input'), list = document.getElementById('cmdk-list');
    function renderList(items){ list.innerHTML = items.map((it,i) => `<div class="cmdk-item ${i===0?'sel':''}" data-hash="${it.hash}"><span>${esc(it.label)}</span><span class="k">${it.k||''}</span></div>`).join(''); }
    renderList(STATIC_CMDS);
    input.focus();
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = input.value.trim();
      if (!q){ renderList(STATIC_CMDS); return; }
      debounce = setTimeout(async () => {
        const results = await searchStocks(q);
        const items = results.map(r => ({label:`${r.symbol} — ${r.name}`, hash:'#/company/'+r.ticker, k:'company'}));
        renderList(items.length ? items : STATIC_CMDS.filter(c => c.label.toLowerCase().includes(q.toLowerCase())));
      }, 150);
    });
    function close(){ cmdkRoot.innerHTML=''; }
    bd.addEventListener('click', e => { if (e.target === bd) close(); });
    list.addEventListener('click', e => { const it = e.target.closest('.cmdk-item'); if (it){ go(it.dataset.hash); close(); } });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter'){ const sel = list.querySelector('.cmdk-item'); if (sel) { go(sel.dataset.hash); close(); } }
    });
  }
  document.getElementById('open-cmdk').addEventListener('click', openCmdk);
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openCmdk(); }
    else if (e.key === '/' && !typing){ e.preventDefault(); openCmdk(); }
  });

  /* ================================================================
     HOME
  ================================================================ */
  function mktCard(label, snap, extra){
    if (!snap) return `<div class="panel mkt-card"><div class="lbl">${label}</div><div class="empty-note" style="margin-top:10px">Data unavailable right now.</div></div>`;
    const chgColor = snap.chg_pct >= 0 ? 'var(--pos)' : 'var(--neg)';
    const regime = snap.regime;
    let chipClass = 'warn';
    if (regime === 'Uptrend' || regime === 'Calm') chipClass = 'good';
    if (regime === 'Downtrend' || regime === 'Stressed') chipClass = 'bad';
    return `<div class="panel mkt-card">
      <div class="lbl">${label}</div>
      <div class="lvl">${fmtNum(snap.level, snap.level>1000?0:2)}</div>
      <div class="chg" style="color:${chgColor}">${fmtPct(snap.chg_pct)} 1D</div>
      ${regime ? `<div class="regime"><span class="chip ${chipClass}">${regime}</span></div>` : ''}
      <div class="asof">as of ${snap.as_of}</div>
    </div>`;
  }

  function breadthCard(b){
    if (!b) return `<div class="panel mkt-card"><div class="lbl">MARKET BREADTH</div><div class="empty-note" style="margin-top:10px">Data unavailable.</div></div>`;
    const pct = Math.round(b.above_250dma / (b.above_250dma + b.below_250dma) * 100);
    return `<div class="panel mkt-card">
      <div class="lbl">MARKET BREADTH</div>
      <div class="lvl">${pct}%</div>
      <div class="chg">of ${b.universe_size} above their 250-day trend</div>
      <div class="regime"><span class="chip ${pct>=50?'good':'bad'}">${b.above_250dma} up · ${b.below_250dma} down</span></div>
      <div class="asof">Nifty 500 universe · as of ${b.as_of}</div>
    </div>`;
  }

  function deskList(items, valueKey, valueFmt){
    if (!items || !items.length) return `<p class="empty-note">No data available yet.</p>`;
    return `<div class="desk-list">${items.map(it => `
      <div class="desk-row" data-t="${it.ticker}.NS">
        <div><span class="tkr">${esc(it.ticker)}</span> <span class="nm">${esc(it.name)}</span></div>
        <div class="val" style="color:${it[valueKey]>=0?'var(--pos)':'var(--neg)'}">${valueFmt(it[valueKey])}</div>
      </div>`).join('')}</div>`;
  }

  async function renderHome(){
    $view.innerHTML = `
      <div class="hero">
        <div class="eyebrow">Personal Investing Research Lab</div>
        <h1>My investing research lab.</h1>
        <p class="sub">A systematic framework I built to study Indian equities through fundamentals, valuation, momentum, quality, market context and risk.</p>
        <div class="disclaimer-line">Personal research project · not investment advice · nothing here predicts prices</div>
        <div class="home-search">
          <input type="text" id="home-search-input" placeholder="Search any NSE company — e.g. Reliance, TCS, Trent…" autocomplete="off" spellcheck="false">
          <div class="suggestions" id="home-suggestions"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Market Snapshot</h2><span class="hint">Live — Yahoo Finance index data</span></div>
        <div class="grid cols-4" id="mkt-cards"><div class="skeleton">Loading market data…</div></div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Today's Research Desk</h2><span class="hint">Research categories, not buy/sell calls · from the last universe update</span></div>
        <div class="grid cols-3" id="desk-cards"><div class="skeleton">Loading…</div></div>
      </div>
    `;
    wireSearchBox(document.getElementById('home-search-input'), document.getElementById('home-suggestions'));

    try{
      const m = await getMarket();
      document.getElementById('mkt-cards').innerHTML =
        mktCard('NIFTY 50', m.nifty50) + mktCard('NIFTY MIDCAP 50', m.midcap) + mktCard('INDIA VIX', m.vix) + breadthCard(m.breadth);
      const b = m.breadth;
      document.getElementById('desk-cards').innerHTML = `
        <div class="panel">
          <div class="eyebrow" style="margin-bottom:10px">Breakout / strong momentum</div>
          ${deskList(b ? b.top_movers : null, 'momentum_pct', v => fmtPct(v,0))}
        </div>
        <div class="panel">
          <div class="eyebrow" style="margin-bottom:10px">Losing momentum</div>
          ${deskList(b ? b.bottom_movers : null, 'momentum_pct', v => fmtPct(v,0))}
        </div>
        <div class="panel">
          <div class="eyebrow" style="margin-bottom:10px">Where to look next</div>
          <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.6">These lists are ranked purely by trailing price momentum across the Nifty 500 — a starting point for research, not a conclusion. Open any name's Company page for the full fundamentals + valuation + technical picture before forming a view.</p>
        </div>
      `;
      document.querySelectorAll('.desk-row').forEach(row => row.addEventListener('click', () => go('#/company/' + row.dataset.t)));
    }catch(e){
      document.getElementById('mkt-cards').innerHTML = `<div class="empty-note">Could not reach the backend.</div>`;
      document.getElementById('desk-cards').innerHTML = '';
    }
  }

  /* ================================================================
     COMPANY RESEARCH TERMINAL
  ================================================================ */
  function stateFor(key, entry){
    if (key === 'S1' && entry.rule_qualifies_now == null) return {label:'NOT ENOUGH HISTORY', cls:'no-data', signal:null};
    if (key === 'S2' && entry.rank == null) return {label:'NOT ENOUGH HISTORY', cls:'no-data', signal:null};
    if (key === 'S4' && entry.pct_from_52w_high == null) return {label:'NOT ENOUGH HISTORY', cls:'no-data', signal:null};
    if (key === 'S3' && entry.in_cheap_half == null) return {label:'NO DATA', cls:'no-data', signal:null};
    if (key === 'S5' && entry.passes_all_filters == null) return {label:'NO DATA', cls:'no-data', signal:null};
    if (entry.held_now) return {label:'ACTIVE NOW', cls:'held', signal:'buy'};
    if (key === 'S1' && entry.rule_qualifies_now) return {label:'QUALIFIES, NO SLOT OPEN', cls:'qualifies', signal:'buy'};
    if (key === 'S5' && entry.passes_all_filters === true) return {label:'QUALIFIES, NOT TOP-RANKED', cls:'qualifies', signal:'buy'};
    return {label:'NOT ACTIVE', cls:'not-selected', signal:'avoid'};
  }

  function tradesTable(trades, isLive, key){
    if (!trades.length) return (isLive && key !== 'S1')
      ? '<p class="no-trades">Trade-by-trade history isn\'t computed for a freshly-analyzed stock yet — this shows today\'s signal only.</p>'
      : '<p class="no-trades">This rule never held this stock over its backtest window.</p>';
    const rows = trades.slice(-6).reverse().map(t => {
      const pnl = t.pnl_pct;
      const pnlCell = pnl == null ? '<span style="color:var(--accent-text)">open</span>' : `<span class="${pnl>=0?'pnl-pos':'pnl-neg'}">${fmtPct(pnl,1)}</span>`;
      return `<tr><td>${t.entry_date}</td><td>${t.exit_date || '—'}</td><td>${t.hold_days ?? '—'}</td><td>${pnlCell}</td></tr>`;
    }).join('');
    const note = trades.length > 6 ? `<div class="no-trades">Showing the 6 most recent of ${trades.length} trades.</div>` : '';
    return `<table class="trades"><thead><tr><th>Entry</th><th>Exit</th><th>Days</th><th>P&amp;L</th></tr></thead><tbody>${rows}</tbody></table>${note}`;
  }

  function strategyCard(key, entry, isLive){
    const meta = (META.strategy_meta || {})[key] || {cagr_pct:null, sharpe:null, max_drawdown_pct:null};
    const state = stateFor(key, entry);
    let whyHtml = `<div class="why">${esc(entry.note)}`;
    if (key === 'S1' && entry.pct_vs_sma != null) whyHtml += ` — <b>${fmtPct(entry.pct_vs_sma)}</b> vs. its 250-day SMA.`;
    if (key === 'S2' && entry.rank != null) whyHtml += ` (<b>${fmtPct(entry.momentum_pct)}</b> trailing momentum)`;
    if (key === 'S3' && entry.value_rank != null) whyHtml += ` — value rank <b>#${entry.value_rank}</b>.`;
    if (key === 'S4' && entry.pct_from_52w_high != null) whyHtml += ` — <b>${fmtPct(entry.pct_from_52w_high)}</b> from its 52-week high.`;
    whyHtml += '</div>';

    let checksHtml = '';
    if (key === 'S5' && entry.checks){
      const labelMap = {roe_above_15:'ROE > 15%', roce_above_15:'ROCE > 15%', positive_fcf:'Positive FCF', earnings_growing:'Earnings growing', debt_ok:'Debt manageable', consistent_3yr:'3yr consistent profit'};
      checksHtml = '<div class="checks">' + Object.entries(entry.checks).map(([k,v]) => `<span class="${v?'pass':'fail'}">${v?'✓':'✕'} ${labelMap[k]||k}</span>`).join('') + '</div>';
      if (entry.roe_pct != null) checksHtml += `<div class="why" style="margin-top:8px">ROE <b>${entry.roe_pct}%</b> · ROCE <b>${entry.roce_pct}%</b></div>`;
    }

    const s = entry.stats;
    const statRow = s.num_trades > 0 ? `
      <div class="stat-row">
        <div class="stat"><div class="v">${s.num_trades}</div><div class="k">Trades</div></div>
        <div class="stat"><div class="v">${s.win_rate_pct}%</div><div class="k">Win rate</div></div>
        <div class="stat"><div class="v" style="color:${s.avg_pnl_pct>=0?'var(--pos)':'var(--neg)'}">${fmtPct(s.avg_pnl_pct)}</div><div class="k">Avg P&amp;L</div></div>
        <div class="stat"><div class="v">${s.avg_hold_days}d</div><div class="k">Avg hold</div></div>
      </div>` : '';

    return `
      <details class="strat-card">
        <summary>
          <span class="dot" style="background:var(--${key.toLowerCase()})"></span>
          <span class="name">${STRATEGY_LABEL[key]}</span>
          <span class="state-pill ${state.cls}">${state.label}</span>
          <span class="chev">▶</span>
        </summary>
        <div class="body">
          <p class="rule">${STRATEGY_RULES[key]}</p>
          ${whyHtml}${checksHtml}${statRow}
          ${tradesTable(entry.trades, isLive, key)}
          <div class="strat-track">Rule's own track record (Nifty 500, 2010–2026): ${meta.cagr_pct!=null?fmtPct(meta.cagr_pct):'—'} CAGR · Sharpe ${meta.sharpe!=null?meta.sharpe.toFixed(2):'—'} · max drawdown ${meta.max_drawdown_pct!=null?fmtPct(meta.max_drawdown_pct):'—'}.</div>
        </div>
      </details>`;
  }

  function renderPriceChart(chart){
    const svg = document.getElementById('price-chart');
    const caption = document.getElementById('chart-caption');
    if (!svg || !caption) return;
    if (!chart || !chart.close || chart.close.length < 2){ caption.textContent = 'Price chart unavailable for this stock.'; return; }
    const W = 680, H = 220, padL = 56, padR = 10, padT = 12, padB = 20;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = chart.close.length;
    const validSma = chart.sma.filter(v => v != null);
    const yMin = Math.min(...chart.close, ...validSma), yMax = Math.max(...chart.close, ...validSma);
    const logPad = (Math.log(yMax) - Math.log(yMin)) * 0.08 || 0.05;
    const y0 = Math.log(yMin) - logPad, y1 = Math.log(yMax) + logPad;
    const xAt = i => padL + (i/(n-1)) * plotW;
    const yAt = v => padT + (1 - (Math.log(v) - y0)/(y1 - y0)) * plotH;
    const pricePts = chart.close.map((c,i) => `${xAt(i).toFixed(1)},${yAt(c).toFixed(1)}`).join(' ');
    let smaSegs = [], cur = [];
    chart.sma.forEach((v,i) => { if (v==null){ if (cur.length>1) smaSegs.push(cur); cur=[]; return; } cur.push(`${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`); });
    if (cur.length>1) smaSegs.push(cur);
    const markers = (chart.trades||[]).map(t => {
      const ex = t.entry_frac*(n-1);
      let s = `<circle cx="${xAt(ex).toFixed(1)}" cy="${yAt(t.entry_price).toFixed(1)}" r="4" style="fill:var(--pos);stroke:var(--surface)" stroke-width="1.5"><title>Buy ${t.entry_date} @ ₹${t.entry_price}</title></circle>`;
      if (t.exit_frac != null){ const xx=t.exit_frac*(n-1); s += `<circle cx="${xAt(xx).toFixed(1)}" cy="${yAt(t.exit_price).toFixed(1)}" r="4" style="fill:var(--neg);stroke:var(--surface)" stroke-width="1.5"><title>Sell ${t.exit_date} @ ₹${t.exit_price}</title></circle>`; }
      return s;
    }).join('');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = `
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" style="stroke:var(--border)"/>
      <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" style="stroke:var(--border)"/>
      <text x="${padL-8}" y="${padT+4}" text-anchor="end" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">₹${Math.round(Math.exp(y1)).toLocaleString('en-IN')}</text>
      <text x="${padL-8}" y="${padT+plotH}" text-anchor="end" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">₹${Math.round(Math.exp(y0)).toLocaleString('en-IN')}</text>
      <text x="${padL}" y="${H-2}" text-anchor="start" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">${chart.dates[0]}</text>
      <text x="${padL+plotW}" y="${H-2}" text-anchor="end" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">${chart.dates[n-1]}</text>
      ${smaSegs.map(seg => `<polyline points="${seg.join(' ')}" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`).join('')}
      <polyline points="${pricePts}" fill="none" style="stroke:var(--ink)" stroke-width="1.8"/>
      ${markers}
    `;
    const hasTrades = (chart.trades||[]).length > 0;
    caption.innerHTML = `Price, split-adjusted, log scale, with its ${chart.sma_period}-day trend line (dashed)` + (hasTrades ? ` · <span class="dot-buy">●</span> buy · <span class="dot-sell">●</span> sell — Strategy 1's rule, live` : '');
  }

  function sparkline(id, values, color){
    const el = document.getElementById(id);
    if (!el) return;
    const vals = values.filter(v => v != null);
    if (vals.length < 2){ el.innerHTML = ''; return; }
    const W=200,H=44,pad=3;
    const min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
    const pts = values.map((v,i) => v==null ? null : `${(pad+(i/(values.length-1))*(W-2*pad)).toFixed(1)},${(H-pad-((v-min)/range)*(H-2*pad)).toFixed(1)}`).filter(Boolean).join(' ');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block"><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="2"/></svg>`;
  }

  function labelFromValue(v, thresholds, labels){
    // thresholds ascending; labels.length = thresholds.length+1
    if (v == null) return labels[labels.length-1];
    for (let i=0;i<thresholds.length;i++) if (v < thresholds[i]) return labels[i];
    return labels[labels.length-1];
  }

  function matrixCell(key, label, value, cls, detail){
    return `<div class="matrix cell ${cls}" data-detail="${esc(detail)}"><div class="cell ${cls}"><div class="k">${label}</div><div class="v">${esc(value)}</div></div></div>`;
  }

  function buildMatrix(stock, fund){
    const s = stock.strategies;
    const cells = [];
    // QUALITY (from S5 checks)
    if (s.S5 && s.S5.checks){
      const passed = Object.values(s.S5.checks).filter(Boolean).length, total = Object.keys(s.S5.checks).length;
      const cls = passed===total?'strong':passed>=total/2?'moderate':'weak';
      cells.push({k:'BUSINESS QUALITY', v: passed===total?'Strong':passed>=total/2?'Moderate':'Weak', cls, detail:`Passes ${passed} of ${total} quality checks: ROE>15%, ROCE>15%, positive free cash flow, manageable debt.`});
    } else cells.push({k:'BUSINESS QUALITY', v:'No data', cls:'nodata', detail:'No usable fundamentals for this company (common for banks/NBFCs, or a very new listing).'});
    // VALUATION
    if (fund && fund.available && fund.valuation && fund.valuation.current){
      const pe = fund.valuation.current.pe, med = fund.valuation.own_5y_median_pe;
      let v='Fair', cls='moderate';
      if (pe!=null && med!=null){ const gap=(pe/med-1)*100; if (gap>20){v='Expensive';cls='weak';} else if (gap<-20){v='Cheap';cls='strong';} }
      cells.push({k:'VALUATION', v, cls, detail: pe!=null ? `Trading at ${pe}x earnings vs its own ${med??'—'}x 5-year median.` : 'P/E not computable (no positive earnings, or no fundamentals data).'});
    } else cells.push({k:'VALUATION', v:'No data', cls:'nodata', detail:'Fundamentals unavailable for this company.'});
    // GROWTH
    if (fund && fund.available && fund.revenue_cagr_pct != null){
      const g = fund.revenue_cagr_pct;
      const cls = g>=15?'strong':g>=5?'moderate':'weak';
      cells.push({k:'GROWTH', v:`${g}% rev. CAGR`, cls, detail:`Revenue CAGR over the full reported history (${fund.years[0]}–${fund.years[fund.years.length-1]}).`});
    } else cells.push({k:'GROWTH', v:'No data', cls:'nodata', detail:'Revenue history unavailable.'});
    // MOMENTUM
    if (s.S2 && s.S2.momentum_pct != null){
      const m = s.S2.momentum_pct;
      const cls = m>15?'improving':m>-5?'moderate':'declining';
      cells.push({k:'MOMENTUM', v:`${fmtPct(m,0)} (6m)`, cls, detail:`Trailing 6-month price momentum (skipping the most recent month), ranked #${s.S2.rank} of ${s.S2.universe_ranked} in the universe.`});
    } else cells.push({k:'MOMENTUM', v:'No data', cls:'nodata', detail:'Not enough price history to compute momentum yet.'});
    // PROFITABILITY
    if (fund && fund.available && fund.roce_pct && fund.roce_pct.filter(v=>v!=null).length){
      const roce = fund.roce_pct.filter(v=>v!=null).slice(-1)[0];
      const cls = roce>=18?'strong':roce>=10?'moderate':'weak';
      cells.push({k:'PROFITABILITY', v:`${roce}% ROCE`, cls, detail:`Most recent reported ROCE (screener.in). Return on capital employed measures how efficiently the business turns capital into profit.`});
    } else cells.push({k:'PROFITABILITY', v:'No data', cls:'nodata', detail:'ROCE not available for this company.'});
    // BALANCE SHEET
    if (fund && fund.available && fund.debt_to_equity && fund.debt_to_equity.filter(v=>v!=null).length){
      const de = fund.debt_to_equity.filter(v=>v!=null).slice(-1)[0];
      const cls = de<0.5?'strong':de<1.5?'moderate':'weak';
      cells.push({k:'BALANCE SHEET', v:`${de}x D/E`, cls, detail:`Debt-to-equity from the most recent reported balance sheet.`});
    } else cells.push({k:'BALANCE SHEET', v:'No data', cls:'nodata', detail:'Balance-sheet figures unavailable.'});
    // CASH FLOW
    if (fund && fund.available && fund.free_cash_flow_cr){
      const pts = fund.free_cash_flow_cr.filter(v=>v!=null);
      if (pts.length){
        const negYears = pts.filter(v=>v<0).length;
        const cls = negYears===0?'strong':negYears<=pts.length/3?'moderate':'weak';
        cells.push({k:'CASH FLOW', v: negYears===0?'Consistent':`Neg. in ${negYears}/${pts.length}yr`, cls, detail:`Free cash flow was negative in ${negYears} of the last ${pts.length} reported years.`});
      } else cells.push({k:'CASH FLOW', v:'No data', cls:'nodata', detail:'No FCF history available.'});
    } else cells.push({k:'CASH FLOW', v:'No data', cls:'nodata', detail:'No FCF history available.'});
    // MARKET TREND
    if (s.S1){
      const above = s.S1.rule_qualifies_now;
      cells.push({k:'MARKET TREND', v: above==null?'No data':above?'Uptrend':'Downtrend', cls: above==null?'nodata':above?'strong':'weak', detail: s.S1.note});
    }
    // RISK (drawdown proxy from S4 distance to 52w high + VIX)
    if (s.S4 && s.S4.pct_from_52w_high != null){
      const pct = s.S4.pct_from_52w_high;
      const cls = pct > -10 ? 'strong' : pct > -25 ? 'moderate' : 'weak';
      cells.push({k:'RISK (DRAWDOWN)', v:`${fmtPct(pct,0)} off high`, cls, detail:`Currently ${fmtPct(pct,1)} from its 52-week high — a simple, transparent proxy for how much air is under the current price.`});
    } else cells.push({k:'RISK (DRAWDOWN)', v:'No data', cls:'nodata', detail:'Not enough price history yet.'});
    return cells;
  }

  async function renderCompany(rawTicker){
    if (!rawTicker){ go('#/'); return; }
    let ticker = rawTicker.toUpperCase();
    if (!ticker.endsWith('.NS')) ticker += '.NS';
    $view.innerHTML = `<div class="skeleton" style="padding:120px 0">Loading ${esc(ticker.replace('.NS',''))}…<br><span style="font-size:11px">Checking cache; live analysis can take up to ~20s for a fresh stock.</span></div>`;

    let stock, chart, fund;
    try{
      const [sr, cr, fr] = await Promise.all([
        fetch(`${API}/api/stock/${encodeURIComponent(ticker)}`),
        fetch(`${API}/api/stock/${encodeURIComponent(ticker)}/chart`).catch(()=>null),
        fetch(`${API}/api/stock/${encodeURIComponent(ticker)}/fundamentals`).catch(()=>null),
      ]);
      if (sr.status === 404){
        $view.innerHTML = `<div class="not-found"><p>Couldn't find "<b>${esc(ticker.replace('.NS',''))}</b>" on the NSE.</p><p style="margin-top:8px">Check the symbol and try again from the <a href="#/" style="color:var(--accent-text)">home search</a>.</p></div>`;
        return;
      }
      if (!sr.ok) throw new Error('server error ' + sr.status);
      stock = await sr.json();
      if (cr && cr.ok) chart = await cr.json();
      if (fr && fr.ok) fund = await fr.json();
    }catch(e){
      $view.innerHTML = `<div class="not-found"><p>Couldn't reach the backend to analyze "${esc(ticker.replace('.NS',''))}".</p><p style="margin-top:8px">${esc(e.message)}</p></div>`;
      return;
    }

    const name = stock.name || ticker.replace('.NS','');
    const isLive = !!stock.live;
    const price = chart ? chart.close[chart.close.length-1] : null;
    const matrix = buildMatrix(stock, fund);

    $view.innerHTML = `
      <div class="co-head">
        <div class="row1"><h1>${esc(name)}</h1><span class="tkr">${esc(ticker.replace('.NS',''))}</span>${isLive ? '<span class="chip warn">Freshly analyzed, live</span>' : '<span class="chip good">Cached, refreshed every 4 days</span>'}</div>
        <div class="price-row">
          ${price!=null ? `<span class="price">₹${fmtNum(price,2)}</span>` : ''}
          <span class="chg" style="color:var(--muted)">as of ${stock.as_of}</span>
        </div>
        <div class="mode-toggle" id="mode-toggle">
          <button data-mode="long" class="active">LONG TERM</button>
          <button data-mode="swing">SWING</button>
        </div>
      </div>

      <div class="section" id="sec-snapshot">
        <div class="section-head"><h2>Investment Research Snapshot</h2><span class="hint">Click any cell for the underlying numbers</span></div>
        <div class="matrix" id="matrix-grid"></div>
        <div class="matrix-detail" id="matrix-detail" hidden></div>
      </div>

      <div class="section" id="sec-chart">
        <div class="section-head"><h2>Price &amp; Trend</h2><span class="hint">Live</span></div>
        <div class="chart-wrap"><svg id="price-chart" viewBox="0 0 680 220" preserveAspectRatio="none"></svg><div class="chart-caption" id="chart-caption">Loading…</div></div>
      </div>

      <div class="section" id="sec-fundamentals"><div class="skeleton">Loading fundamentals…</div></div>

        <div class="section-head"><h2>Market Behaviour <span style="color:var(--muted);font-weight:400;font-size:13px">— the 5 rules</span></h2><span class="hint">Existing strategy engine, unchanged</span></div>
        <div class="strat-cards">${STRATEGY_ORDER.map(k => strategyCard(k, stock.strategies[k], isLive)).join('')}</div>
      </div>

    grid.querySelectorAll('.cell').forEach(el => el.addEventListener('click', () => {
      const c = cells[el.dataset.i];
      detail.hidden = false;
      detail.innerHTML = `<b>${c.k}</b> — ${esc(c.detail)}`;

  function renderValuationSection(fund){
    const el = document.getElementById('sec-valuation');
    if (!fund || !fund.available || !fund.valuation || !fund.valuation.current){
      el.innerHTML = `<div class="section-head"><h2>Valuation</h2></div><div class="panel"><p class="empty-note">Valuation unavailable — no positive earnings or no fundamentals data for this company.</p></div>`;
      return;
    }
    const v = fund.valuation, cur = v.current;
    const pe = cur.pe, med = v.own_5y_median_pe, umed = v.universe_median_pe;
    let pct = 50;
    if (pe != null && med != null){
      const ratio = pe/med;
      pct = Math.max(4, Math.min(96, 50 + (ratio-1)*80));
    }

  /* ================================================================

  ================================================================ */
  function lineChart(id, dates, seriesMap, order, colorFor, opts){
    opts = opts || {};
    const el = document.getElementById(id);
    const W=680,H=300,padL=54,padR=12,padT=14,padB=24;
    const plotW=W-padL-padR, plotH=H-padT-padB;
    const allVals = order.flatMap(k => (seriesMap[k]||[]).filter(v=>v!=null));
    if (!allVals.length){ el.innerHTML='<p class="empty-note">No data.</p>'; return; }
    let yMin=Math.min(...allVals), yMax=Math.max(...allVals);
    let toY;
    if (opts.log){
      yMin = Math.max(yMin, 1e-6);
      const ly0=Math.log(yMin), ly1=Math.log(yMax); const pad=(ly1-ly0)*0.06||0.05;
      toY = v => padT + (1-(Math.log(Math.max(v,1e-6))-(ly0-pad))/((ly1+pad)-(ly0-pad)))*plotH;
    } else {
      const pad=(yMax-yMin)*0.08||1; const y0=yMin-pad, y1=yMax+pad;
      toY = v => padT + (1-(v-y0)/(y1-y0))*plotH;
    }
    const n = dates.length;
    const toX = i => padL + (i/(n-1))*plotW;
    const lines = order.map(k => {
      const vals = seriesMap[k]||[];
      let segs=[], cur=[];
      vals.forEach((v,i) => { if (v==null){ if(cur.length>1) segs.push(cur); cur=[]; return;} cur.push(`${toX(i).toFixed(1)},${toY(v).toFixed(1)}`); });
      if (cur.length>1) segs.push(cur);
      return segs.map(seg => `<polyline points="${seg.join(' ')}" fill="none" style="stroke:${colorFor(k)}" stroke-width="2"/>`).join('');
    }).join('');
    const yTop = opts.log ? Math.exp(Math.log(yMax)+ (Math.log(yMax)-Math.log(yMin))*0.06) : yMax + (yMax-yMin)*0.08;
    const yBot = opts.log ? Math.exp(Math.log(yMin) - (Math.log(yMax)-Math.log(yMin))*0.06) : yMin - (yMax-yMin)*0.08;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;overflow:visible">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" style="stroke:var(--border)"/>
      <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" style="stroke:var(--border)"/>
      <text x="${padL-6}" y="${padT+4}" text-anchor="end" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">${opts.fmt ? opts.fmt(yTop) : yTop.toFixed(1)}</text>
      <text x="${padL-6}" y="${padT+plotH}" text-anchor="end" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">${opts.fmt ? opts.fmt(yBot) : yBot.toFixed(1)}</text>
      <text x="${padL}" y="${H-4}" text-anchor="start" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">${dates[0]}</text>
      <text x="${padL+plotW}" y="${H-4}" text-anchor="end" font-size="10" font-family="var(--mono)" style="fill:var(--muted)">${dates[n-1]}</text>
      ${lines}
    </svg>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:center">
      ${order.map(k => `<span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${colorFor(k)};margin-right:5px"></span>${esc(k)}</span>`).join('')}
    </div>`;
  }

    renderReviewed(entry);
  }

  /* ================================================================

  function renderMethodology(){
    $view.innerHTML = `
      <div class="hero" style="padding:44px 0 6px"><div class="eyebrow">Full Transparency</div><h1 style="font-size:clamp(26px,5vw,38px)">Methodology</h1></div>
      <div class="section">
        <div class="method-section">
          <h3>Data sources</h3>
          <ul>
            <li><b>Prices, dividends, splits</b> — Yahoo Finance's public chart endpoint, fetched live.</li>
            <li><b>Fundamentals</b> (revenue, profit, ROCE, free cash flow, debt) — scraped from screener.in's public per-company pages. This is not an official API; it's rate-limited and cached, but can break if screener changes its page layout.</li>
            <li><b>Index &amp; market data</b> (Nifty 50, Nifty Midcap 50, India VIX) — same Yahoo endpoint, live.</li>
          </ul>
        </div>
        <div class="method-section">
          <h3>Point-in-time discipline</h3>
          <p>A company's annual results are only treated as "known" 60 days after the fiscal year-end (SEBI's audited-results filing deadline). Backtests never use a number before it would actually have been public.</p>
        </div>
        <div class="method-section">
          <h3>Known limitation: historical P/E and stock splits</h3>
          <p>The valuation history chart divides today's split-adjusted price convention against each year's <i>as-reported</i> EPS. For a company with a stock split or bonus issue partway through its history, older P/E figures can look artificially low or high. Treat the historical P/E range as directional, not precise, for such companies.</p>
        </div>
        <div class="method-section">
          <h3>Universe &amp; survivorship bias</h3>
          <p>The Nifty 500 constituent list used is <i>today's</i> list, applied across the full backtest window — a company that was removed or delisted along the way is invisible to the backtest. This is a real, disclosed source of optimism in the historical results.</p>
        </div>
        <div class="method-section">
          <h3>What's excluded, and why</h3>
          <p>Banks and NBFCs are excluded from the value/quality strategies (S3, S5) and from company-level fundamentals entirely — they report Revenue/Financing-Profit instead of Sales/EBITDA, so ratios like EV/EBITDA don't mean the same thing for them. This isn't a bug to patch; it's a sector-specific screen this build doesn't implement.</p>
        </div>
        <div class="method-section">
          <h3>Backtesting &amp; portfolio simulation</h3>
          <p>Purged walk-forward validation, real Indian transaction costs and slippage, independent cash ledgers per strategy, and full trade-by-trade logging. Historical performance does not guarantee future performance — every number on this site is a backtest result or a live snapshot, never a prediction.</p>
        </div>
        <div class="method-section">
          <h3>Limitations, stated plainly</h3>
          <ul>
            <li>Live analysis for a stock outside the pre-built 500 only computes <i>today's</i> signal for Strategies 2–5 — not a full historical trade log (that needs re-ranking the whole universe on every past date).</li>
            <li>Fundamentals history runs to about 12 years (FY2015+), shorter than the 16-year price history.</li>
            <li>"Sector median" valuation isn't implemented — the Nifty 500 universe median is shown instead, and labeled as such.</li>
            <li>Everything on this site is a research output, not investment advice.</li>
          </ul>
        </div>
      </div>
    `;
  }

  boot();
  setInterval(refreshMarketPill, 5*60*1000);
})();
</script>
